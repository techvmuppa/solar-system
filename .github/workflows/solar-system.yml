name: Solar System Workflow

on:
    workflow_dispatch:
    push:
        branches:
            - main
            - 'feature/*'

env:
    MONGO_URI: 'mongodb+srv://superUser:superPassword@planets.bwahbhy.mongodb.net/?appName=planets'


jobs:
    unit-testing:
        name: Unit Testing
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v7

            - name: Setup node version - 24
              uses: actions/setup-node@v7
              with:
                node-version: 24
            - name: Instaling Dependencies
              run: npm install

            - name: Unit Testing
              run: npm test
